<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements · Hello Hobnobbers Admin</title><link rel="icon" href="assets/hello-hobnobbers-logo.png"><link rel="stylesheet" href="assets/styles.css"></head><body><div class="admin-shell"><aside class="sidebar"></aside><main class="dash-main"><div class="dash-top"><div><div class="kicker">Hello Hobnobbers · Admin</div><h1>Announcements</h1></div><div class="dash-top-actions"></div></div><section class="card card-pad" style="max-width:760px"><div class="kicker">Send Notification</div><h3>Email + in-app announcement</h3><form id="announcementForm"><div class="field"><label>Title</label><input name="title" required></div><div class="field" style="margin-top:14px"><label>Audience</label><select name="audience"><option value="all">All approved users</option><option value="event_attendees">Confirmed attendees of an event</option></select></div><div class="field" style="margin-top:14px"><label>Event ID · required for event attendees</label><input name="event_id" type="number"></div><div class="field" style="margin-top:14px"><label>Message</label><textarea name="message" rows="8" required></textarea></div><div class="form-actions"><button class="btn" type="submit">Send Announcement</button></div></form></section><div class="notice" style="margin-top:18px">For automatic 2-days-before-event reminders, configure a daily cPanel cron to call <code>backend/api/cron/send-event-reminders.php</code>.</div></main></div><div class="toast"></div><script src="assets/admin.js"></script><script src="assets/theme-effects.js" defer></script></body></html>
