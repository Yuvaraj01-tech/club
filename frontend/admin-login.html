<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · Hello Hobnobbers</title><link rel="icon" href="assets/hello-hobnobbers-logo.png"><link rel="stylesheet" href="assets/styles.css"></head><body data-admin="login"><main class="auth-page"><section class="card auth-card"><img class="logo-small" src="assets/hello-hobnobbers-logo.png" alt="Hello Hobnobbers"><div class="kicker" style="text-align:center">Secure Administration</div><h1>Admin Login</h1><p class="sub">Separate access for event operations, verification, payments and check-in.</p><form id="adminLogin"><div class="field"><label>Admin Username</label><input name="username" required autocomplete="username" value="admin"></div><div class="field" style="margin-top:14px"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn block" style="margin-top:20px">Sign In to Admin</button></form><p class="muted" style="text-align:center;margin-top:18px">Default first-login password: <b>ChangeMe@123</b>. Change the seeded admin password before production use.</p><a class="btn secondary block" style="margin-top:8px" href="index.html">← Back to website</a></section></main><div class="toast"></div><script>const API='../backend/api';const f=document.querySelector('#adminLogin');const toast=m=>{const t=document.querySelector('.toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'/admin/login.php',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Login failed');location.href='admin-dashboard.html'}catch(x){toast(x.message)}};</script><script src="assets/theme-effects.js" defer></script></body></html>
