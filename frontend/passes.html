<main class="page"><div class="container"><div class="page-head"><div class="kicker">Event Pass</div><h1>Your digital passes.</h1><p>Show the QR code at check-in. Each pass can be used only once.</p></div><div id="passesList" class="grid"><div class="notice">Loading…</div></div></div></main>
<footer class="footer"><div class="container footer-grid"><div><b>Hello Hobnobbers</b><div class="muted">Curated clubbing & event experiences.</div></div><div>© 2026 Hello Hobnobbers · <a href="admin-login.html">Admin</a></div></div></footer>
<div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
window.addEventListener('load', function () {
    document.querySelectorAll('.qr[data-pass-token]').forEach(function (el) {
        const token = el.getAttribute('data-pass-token');

        if (token && typeof QRCode !== 'undefined') {
            new QRCode(el, {
                text: token,
                width: 140,
                height: 140
            });
        }
    });
});
</script>
