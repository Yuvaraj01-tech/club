<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in · Hello Hobnobbers Admin</title><link rel="icon" href="assets/hello-hobnobbers-logo.png"><link rel="stylesheet" href="assets/styles.css"></head><body><div class="admin-shell"><aside class="sidebar"></aside><main class="dash-main"><div class="dash-top"><div><div class="kicker">Hello Hobnobbers · Admin</div><h1>Check-in</h1></div><div class="dash-top-actions"></div></div><div class="scanner"><section class="card scanner-box"><div><div style="font-size:4rem;color:var(--gold)">⌁</div><h2>QR / Pass Verification</h2><p class="muted">Camera scanning can be connected to the same endpoint. For now, enter the booking/pass code for reliable desktop and mobile check-in.</p><div style="max-width:460px;margin:0 auto 16px"><video id="qrVideo" playsinline style="width:100%;border-radius:16px;border:1px solid var(--line);display:none"></video><button type="button" class="btn secondary block" id="cameraBtn">Start Camera QR Scanner</button></div><form id="scanForm" style="text-align:left;max-width:460px;margin:auto"><div class="field"><label>Pass Code</label><input name="pass_code" required placeholder="PASS-XXXXXXXXXX"></div><div class="field" style="margin-top:12px"><label>Event ID · optional</label><input name="event_id" type="number" placeholder="Validate against a specific event"></div><button class="btn block" style="margin-top:15px">Verify Entry</button></form></div></section><section id="scanResult" class="card"><div class="status-card"><div class="status-icon warn">?</div><h2>Ready</h2><p class="muted">Scan result will appear here.</p></div></section></div></main></div><div class="toast"></div><script src="assets/site.js"></script><script src="assets/admin.js"></script><script src="assets/theme-effects.js" defer></script></body></html>
